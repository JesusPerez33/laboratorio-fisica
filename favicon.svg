  <g stroke-width="5" stroke-linecap="round">
    <line x1="30" y1="34" x2="30" y2="15" stroke="#86bcff"/>
    <line x1="30" y1="34" x2="30" y2="50" stroke="#ff8f80"/>
    <line x1="30" y1="34" x2="48" y2="34" stroke="#f0b860"/>
