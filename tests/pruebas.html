<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas del motor de física</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 7px 10px; border-top: 1px solid var(--line); font-size: 14px; }
    th { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
    tr.ok td:first-child, #resumen.ok { color: var(--f-p); font-weight: 600; }
    tr.falla td:first-child, #resumen.falla { color: var(--f-w); font-weight: 600; }
    #resumen { font-family: var(--display); font-size: 22px; margin: 0; }
    .scroll { overflow-x: auto; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Laboratorio de Cuerpo Libre</p>
    <h1>Pruebas del motor de física</h1>
    <p class="lede">Cada fila compara el resultado de <code>fisica.js</code> con la solución analítica de un problema clásico. <a href="../index.html" style="color:var(--accent)">Volver al laboratorio</a></p>
  </header>
  <p id="resumen"></p>
  <div class="panel scroll">
    <table>
      <thead><tr><th>Resultado</th><th>Prueba</th><th>Obtenido</th><th>Esperado</th></tr></thead>
      <tbody id="tabla"></tbody>
    </table>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/fisica.js"></script>
<script src="../js/energia.js"></script>
<script src="../js/experimento.js"></script>
<script src="pruebas.js"></script>
</body>
</html>
